name: Newsroom Core QA

on:
  pull_request:
    paths:
      - "newsroom/**"
      - "go/**"
      - "scripts/validate-newsroom-core.mjs"
      - "scripts/validate-newsroom-cases.mjs"
      - "scripts/build-state-board.mjs"
      - "scripts/sync-hub-routes.mjs"
      - ".github/workflows/newsroom-core-qa.yml"
  push:
    branches:
      - "automation/newsroom-orchestrator-v1"
    paths:
      - "newsroom/**"
      - "go/**"
      - "scripts/validate-newsroom-core.mjs"
      - "scripts/validate-newsroom-cases.mjs"
      - "scripts/build-state-board.mjs"
      - "scripts/sync-hub-routes.mjs"
      - ".github/workflows/newsroom-core-qa.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate newsroom core
        run: node scripts/validate-newsroom-core.mjs
      - name: Validate case files
        run: node scripts/validate-newsroom-cases.mjs
      - name: Validate State Board index
        run: node scripts/build-state-board.mjs
      - name: Validate Hub short routes
        run: node scripts/sync-hub-routes.mjs
