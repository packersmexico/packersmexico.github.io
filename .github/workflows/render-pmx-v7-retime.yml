name: Render PMX V7 Week1 Retime Final

on:
  push:
    branches:
      - pmx-v7-week1-retime-final
    paths:
      - 'video-retime-final/src/**'
      - 'video-retime-final/scripts/**'
      - 'video-retime-final/package.json'
      - 'video-retime-final/tsconfig.json'
      - 'video-retime-final/assets/**'
      - '.github/workflows/render-pmx-v7-retime.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  DIR: video-retime-final
  OUT: PMX-Offseason-Chisme-2026-V7-WEEK1-RETIME-FINAL.mp4

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pmx-v7-week1-retime-final
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip

      - name: Install Remotion
        working-directory: ${{ env.DIR }}
        run: npm install --no-audit --no-fund

      - name: Prepare locked V6 visuals and approved new voice
        working-directory: ${{ env.DIR }}
        run: bash scripts/prepare-assets.sh

      - name: Derive timing from actual audio
        working-directory: ${{ env.DIR }}
        run: node scripts/build-timings.mjs

      - name: Render Remotion master
        working-directory: ${{ env.DIR }}
        run: npm run render -- --concurrency=4

      - name: Technical QA and review sheet
        working-directory: ${{ env.DIR }}
        run: |
          mkdir -p publish/qa
          cp "out/${OUT}" "publish/${OUT}"
          ffprobe -v error -show_entries format=duration,size,bit_rate:stream=index,codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of json "publish/${OUT}" | tee publish/qa/ffprobe.json
          ffmpeg -v error -i "publish/${OUT}" -f null -
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "publish/${OUT}")" = "1080"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "publish/${OUT}")" = "1920"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "publish/${OUT}" | grep -q audio
          ffmpeg -y -i "publish/${OUT}" -vf "fps=1/6,scale=180:320:force_original_aspect_ratio=decrease,pad=180:320:(ow-iw)/2:(oh-ih)/2,tile=5x3:padding=8:margin=8" -frames:v 1 publish/qa/contact-sheet.jpg
          cp src/timings.json publish/qa/timings.json

      - name: Commit final MP4 and QA to render branch
        run: |
          git config user.name 'PMX Remotion Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add video-retime-final/publish
          git commit -m 'render(retime): publish V7 Week1 final master' || exit 0
          git push origin HEAD:pmx-v7-week1-retime-final
