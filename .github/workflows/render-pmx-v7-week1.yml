name: Render PMX V7 Week 1

on:
  push:
    branches:
      - pmx-v7-week1-render
    paths:
      - 'video-v7-week1/**'
      - '.github/workflows/render-pmx-v7-week1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKDIR: video-v7-week1
  OUTPUT: PMX-Offseason-Chisme-2026-V7-WEEK1-FINAL.mp4

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Remotion dependencies
        working-directory: ${{ env.WORKDIR }}
        run: npm install --no-audit --no-fund

      - name: Generate NEW V7 narration
        working-directory: ${{ env.WORKDIR }}
        run: |
          python -m pip install --disable-pip-version-check edge-tts==7.2.3
          python scripts/generate-v7-voice.py
          for f in public/audio/S*.mp3; do ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f"; done

      - name: Materialize locked 03.5 visual assets
        working-directory: ${{ env.WORKDIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/prepare-assets-v2.sh')
          s = p.read_text(encoding='utf-8')
          a = s.index('# Exact uploaded authoritative horizontal V1.1 asset')
          b = s.index('# Asset map locked by 03.5.')
          logo = '''# Authoritative PACKERS MÉXICO horizontal V1.1 master already governed in this repository. Never rebuild or recolor.\necho '[logo] using approved horizontal V1.1 repository master'\ncp "$ROOT/../assets/PMX_LOGO_HISTORICO_HORIZONTAL_CANVA_MASTER_V1.1.svg" "$ASSETS/pmx-logo.svg"\ngrep -qi '<svg' "$ASSETS/pmx-logo.svg"\nsha256sum "$ASSETS/pmx-logo.svg"\n\n'''
          s = s[:a] + logo + s[b:]
          c = s.index('# NEW V7 narration.')
          d = s.index("echo '[assets] ready'")
          s = s[:c] + "# NEW V7 narration generated locally in the previous workflow step. V6 is never downloaded or referenced.\n\n" + s[d:]
          p.write_text(s, encoding='utf-8')
          PY
          bash scripts/prepare-assets-v2.sh

      - name: Derive timing from actual scene voice files
        working-directory: ${{ env.WORKDIR }}
        run: python3 scripts/build-timings.py

      - name: Validate Remotion composition
        working-directory: ${{ env.WORKDIR }}
        run: |
          npx remotion browser ensure || true
          npm run compositions

      - name: Render V7 Week 1 master
        working-directory: ${{ env.WORKDIR }}
        run: npm run render:v7 -- --concurrency=4

      - name: Technical QA
        working-directory: ${{ env.WORKDIR }}
        run: |
          mkdir -p out/qa
          ffprobe -v error -show_entries format=duration,size,bit_rate:stream=index,codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of json "out/${OUTPUT}" | tee out/qa/ffprobe.json
          ffmpeg -v error -i "out/${OUTPUT}" -f null -
          ffmpeg -y -ss 0 -i "out/${OUTPUT}" -vf "fps=1/6,scale=216:384:force_original_aspect_ratio=decrease,pad=216:384:(ow-iw)/2:(oh-ih)/2,tile=5x5:padding=8:margin=8" -frames:v 1 out/qa/contact-sheet.jpg
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "out/${OUTPUT}")" = "1080"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "out/${OUTPUT}")" = "1920"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "out/${OUTPUT}")" = "30/1"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "out/${OUTPUT}")" = "h264"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "out/${OUTPUT}")" = "aac"

      - name: Upload final MP4 and QA
        uses: actions/upload-artifact@v4
        with:
          name: PMX-Offseason-Chisme-2026-V7-WEEK1-FINAL
          path: |
            video-v7-week1/out/PMX-Offseason-Chisme-2026-V7-WEEK1-FINAL.mp4
            video-v7-week1/out/qa/contact-sheet.jpg
            video-v7-week1/out/qa/ffprobe.json
            video-v7-week1/src/timings.json
          if-no-files-found: error
          retention-days: 7
