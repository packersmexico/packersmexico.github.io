name: Quiniela Operator Notifications
# Dashboard notifications only. Push is sent centrally by milestone-sync, never here.

on:
  push:
    branches: [main]
    paths:
      - 'quiniela-control/data.json'
      - 'quiniela-control/capture-config.json'
      - 'quiniela-control/weeks/week-*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quiniela-operator-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build milestone notification
        shell: python
        run: |
          import json, pathlib

          data_path=pathlib.Path("quiniela-control/data.json")
          capture_cfg_path=pathlib.Path("quiniela-control/capture-config.json")
          notices_path=pathlib.Path("quiniela-control/notifications.json")
          event_path=pathlib.Path(".pmx-push-event.json")
          data=json.loads(data_path.read_text(encoding="utf-8"))
          capture_cfg=json.loads(capture_cfg_path.read_text(encoding="utf-8")) if capture_cfg_path.exists() else {}

          data_week=int(data.get("week_number") or 0)
          capture_week=int(capture_cfg.get("week_number") or 0)
          capture_open=str(capture_cfg.get("status") or "").upper()=="OPEN"
          use_capture_ahead=bool(capture_week>data_week and capture_week<=data_week+1)

          if use_capture_ahead:
              week=capture_week
              capture={
                "complete":capture_cfg.get("complete",0),
                "total":capture_cfg.get("total",9),
                "window":capture_cfg.get("status") or "UNKNOWN",
                "deadline_label":capture_cfg.get("deadline_label") or "—"
              }
              results={}
          else:
              week=data_week
              capture=data.get("capture") or {}
              results=data.get("results") or {}
          complete=int(capture.get("complete") or 0)
          total=int(capture.get("total") or 9)
          final=int(results.get("final") or 0)
          games_total=int(results.get("total") or 16)
          window=str(capture.get("window") or "").upper()
          deadline=str(capture.get("deadline_label") or "—")

          event=None
          if use_capture_ahead and window=="OPEN":
              previous=pathlib.Path(f"quiniela-control/weeks/week-{week-1:02d}.json")
              prior_final=False
              prior_final_label=""
              if previous.exists():
                  prev=json.loads(previous.read_text(encoding="utf-8"))
                  pr=prev.get("results") or {}
                  prior_final=bool(pr.get("total") and pr.get("final")==pr.get("total") and str(pr.get("status") or "").upper()=="FINAL")
                  if prior_final:
                      prior_final_label=f"Week {week-1} cerrada {pr.get('final')}/{pr.get('total')}. "
              event={
                "eventKey":f"W{week}_OPEN",
                "title":f"QUINIELA PMX · WEEK {week} ABIERTA",
                "body":f"{prior_final_label}Week {week}: {complete}/{total} respuestas · cierre {deadline}.",
                "url":"https://packersmexico.github.io/quiniela-control/captura/",
                "tag":f"pmx-quiniela-w{week}-open"
              }
          elif games_total and final==games_total and str(results.get("status") or "").upper()=="FINAL":
              event={
                "eventKey":f"W{week}_FINAL",
                "title":f"QUINIELA PMX · WEEK {week} FINAL",
                "body":f"{final}/{games_total} partidos FINAL. Resultados y rankings definitivos están listos.",
                "url":"https://packersmexico.github.io/quiniela-control/",
                "tag":f"pmx-quiniela-w{week}-final"
              }
          elif total and complete==total and window=="CLOSED":
              event={
                "eventKey":f"W{week}_9OF9",
                "title":f"QUINIELA PMX · WEEK {week} · PICKS COMPLETOS",
                "body":f"{complete}/{total} participantes · captura cerrada. Picks y piezas ya pueden revisarse en el panel.",
                "url":"https://packersmexico.github.io/quiniela-control/",
                "tag":f"pmx-quiniela-w{week}-9of9"
              }
          elif window=="OPEN":
              previous=pathlib.Path(f"quiniela-control/weeks/week-{week-1:02d}.json")
              prior_final=False
              if previous.exists():
                  prev=json.loads(previous.read_text(encoding="utf-8"))
                  pr=prev.get("results") or {}
                  prior_final=bool(pr.get("total") and pr.get("final")==pr.get("total") and str(pr.get("status") or "").upper()=="FINAL")
              prefix=f"Week {week-1} cerrada 16/16. " if prior_final else ""
              event={
                "eventKey":f"W{week}_OPEN",
                "title":f"QUINIELA PMX · WEEK {week} ABIERTA",
                "body":f"{prefix}Week {week}: {complete}/{total} respuestas · cierre {deadline}.",
                "url":"https://packersmexico.github.io/quiniela-control/",
                "tag":f"pmx-quiniela-w{week}-open"
              }

          # Single W5 reminder keyed distinctly from general Week-open alert.
          if week == 5 and complete == 8 and total == 9 and window == "OPEN":
              event={
                "eventKey":"W5_REMINDER_8OF9_20261008_1600",
                "title":"QUINIELA PMX · WEEK 5 · FALTA UNO",
                "body":"Rodri y Alex ya enviaron. Falta LUIS C. · captura abierta hasta hoy 16:00 CDMX.",
                "url":"https://packersmexico.github.io/quiniela-control/captura/",
                "tag":"pmx-w5-reminder-8of9"
              }

          # One-time admin review notice only after actual W5 Figma 9/9 PNG export verification.
          if week == 5 and complete == 9 and total == 9 and str((data.get("publication") or {}).get("assets_status") or "") == "W5_PICKS_FIGMA_REVIEW_READY_9OF9":
              event={
                "eventKey":"W5_FIGMA_PICKS_REVIEW_READY_9OF9_20261008",
                "title":"QUINIELA PMX · W5 FIGMA LISTO PARA REVISIÓN",
                "body":"Hoja 9/9 · 135 picks y 3 móviles exportados. Revisa en el panel; NO publicar antes de aprobación de Dirección.",
                "url":"https://packersmexico.github.io/quiniela-control/exports/live.html#pmx-w5-review",
                "tag":"pmx-w5-figma-review-ready"
              }

          if not event:
              print("No milestone notification for this state.")
              event_path.write_text("{}",encoding="utf-8")
              raise SystemExit(0)

          event_path.write_text(json.dumps(event,ensure_ascii=False),encoding="utf-8")

          if notices_path.exists():
              notices=json.loads(notices_path.read_text(encoding="utf-8"))
          else:
              notices={"updated_at":None,"items":[]}

          item={
            "id":event["eventKey"],
            "status":"READY",
            "title":event["title"].replace("QUINIELA PMX · ",""),
            "body":event["body"],
            "href":"./",
            "secondary_href":"./captura/" if event["eventKey"].endswith("_OPEN") else "./exports/live.html",
            "secondary_label":"ABRIR FORMULARIO" if event["eventKey"].endswith("_OPEN") else "VER PIEZAS"
          }
          existing=[x for x in notices.get("items",[]) if x.get("id")!=item["id"]]
          notices["items"]=[item]+existing[:4]
          notices["updated_at"]=capture_cfg.get("last_sync") if use_capture_ahead else data.get("last_sync")
          notices_path.write_text(json.dumps(notices,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

      - name: Update operator notification center with optimistic concurrency retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep the event from the triggering snapshot, but always reconcile with
          # the latest notification center before attempting to push to main.
          # Do not force-push, discard unrelated commits, or duplicate event IDs.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import json
          from pathlib import Path

          source=Path('.pmx-push-event.json')
          event=json.loads(source.read_text(encoding='utf-8')) if source.exists() else {}
          if not event or not event.get('eventKey'):
              print('No event in triggering snapshot')
              raise SystemExit(0)
          path=Path('quiniela-control/notifications.json')
          notices=json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'updated_at':None,'items':[]}
          event_id=event['eventKey']
          item={
              'id':event_id, 'status':'READY',
              'title':event['title'].replace('QUINIELA PMX · ',''),
              'body':event['body'],'href':'./',
              'secondary_href':'./captura/' if event_id.endswith('_OPEN') else './exports/live.html',
              'secondary_label':'ABRIR FORMULARIO' if event_id.endswith('_OPEN') else 'VER PIEZAS'
          }
          current=list(notices.get('items') or [])
          prior=next((i for i,x in enumerate(current) if x.get('id')==event_id),None)
          if prior is None:
              notices['items']=[item]+current[:4]
          elif current[prior]!=item:
              current[prior]=item
              notices['items']=current[:5]
          else:
              print('Notification event already present; preserving existing ordering')
              raise SystemExit(0)
          cfg=json.loads(Path('quiniela-control/capture-config.json').read_text(encoding='utf-8'))
          data=json.loads(Path('quiniela-control/data.json').read_text(encoding='utf-8'))
          cfg_week=int(cfg.get('week_number') or 0)
          data_week=int(data.get('week_number') or 0)
          notices['updated_at']=(cfg.get('last_sync') if cfg_week>data_week else data.get('last_sync')) or notices.get('updated_at')
          path.write_text(json.dumps(notices,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            git add -- quiniela-control/notifications.json
            if git diff --cached --quiet; then
              echo "Notification center current"
              exit 0
            fi
            git commit -m "Quiniela: refresh operator notification center"
            if git push origin HEAD:main; then
              echo "Operator notice persisted on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::main changed concurrently; reconciling against fresh head (attempt ${attempt})"
            sleep 3
          done
          echo '::error::Operator notification not persisted after bounded concurrency retries'
          exit 1
