name: Quiniela Weekly Contract QA
on:
  push:
    branches: [main]
    paths:
      - 'quiniela-control/**'
      - 'push-backend/api/subscribe.js'
      - 'push-backend/api/notify.js'
      - 'scripts/qa-quiniela-contract.mjs'
      - 'scripts/prepare-quiniela-figma-handoff.mjs'
      - '.github/workflows/quiniela-production-handoff.yml'
      - '.github/workflows/quiniela-asset-index.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'quiniela-control/**'
      - 'push-backend/**'
      - 'scripts/qa-quiniela-contract.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate frontend JavaScript
        run: |
          node --check quiniela-control/app.js
          node --check quiniela-control/push.js
          node --check quiniela-control/exports/live.js
          node --check quiniela-control/exports/assets-library.js
      - name: Validate push backend modules and production scripts
        run: |
          node --check push-backend/api/subscribe.js
          node --check push-backend/api/subscribe-form.js
          node --check push-backend/api/notify.js
          node --check push-backend/api/score-week.js
          node --check push-backend/api/scoring-status.js
          node --check push-backend/lib/weekly-rankings.js
          node --check push-backend/api/milestone-sync.js
          node --check scripts/refresh-quiniela-assets.mjs
          node --check scripts/prepare-quiniela-figma-handoff.mjs
          python3 -m py_compile scripts/sync-quiniela-live.py
          python3 scripts/sync-quiniela-live.py --self-test
      - name: Enforce weekly data and image QA contract
        run: node scripts/qa-quiniela-contract.mjs
      - name: W5 PUSH 15-of-15 Figma data contract without private selections
        run: |
          node scripts/prepare-quiniela-figma-handoff.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const h=JSON.parse(fs.readFileSync('quiniela-control/production/week-05-figma-handoff.json','utf8'));
          const g=h.games;
          assert.equal(g.length,15);
          assert.equal(g.filter(x=>x.status==='FINAL').length,14);
          assert.equal(g.filter(x=>x.status==='TIE').length,1);
          assert.equal(h.stages.results,'READY_FOR_04');
          assert.equal(h.stages.weekly,'READY_FOR_04');
          assert.equal(h.stages.season,'READY_FOR_04');
          assert.equal(h.weekly.length,9);
          assert.equal(h.weekly.filter(x=>x.correct===11).length,3);
          assert.equal(h.matrix,undefined,'Private picks must not be published in the 04 handoff');
          const txt=JSON.stringify(h);
          assert(!txt.includes('"submission_id"') && !txt.includes('"picks":['),'Never leak first-valid submissions');
          console.log('PASS W5: 15/15 decided, 14 scored, G09 PUSH, three shared weekly leaders; no private picks in public handoff');
          NODE
