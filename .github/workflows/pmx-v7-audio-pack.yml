name: PMX V7 Audio Pack
on:
  push:
    branches: [pmx-v7-week1-retime-final]
    paths: ['video-retime-final/audio-pack-trigger.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved crisp voice clips
        run: |
          mkdir -p audio
          curl -fL 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/ece806e3-2e33-4006-ac22-ba29fbc13b86.mp3' -o audio/S01.mp3
          curl -fL 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/0cef0ede-6468-4d62-91d7-124aee2df8ca.mp3' -o audio/S02.mp3
          curl -fL 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/24e7c651-593e-41c5-8751-9f7850edb45d.mp3' -o audio/S03.mp3
          curl -fL 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/1b94855d-364e-4640-a86e-24d1737597cd.mp3' -o audio/S04.mp3
          curl -fL 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/aad43722-ed44-404a-855d-e3a97ad6a3e5.mp3' -o audio/S05.mp3
          curl -fL 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/f1c900e7-4e41-4ff9-9450-08d92dd49f7a.mp3' -o audio/S06.mp3
          curl -fL 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/60daf60f-4e6b-4f47-8627-9ebdd7a7ff34.mp3' -o audio/S07.mp3
          curl -fL 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/aa01f622-c739-4237-9164-f9e8b59f8df4.mp3' -o audio/S08.mp3
          curl -fL 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/6a7fb4f9-cbc6-44f5-8ae7-65cfef86d47b.mp3' -o audio/S09.mp3
          curl -fL 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/ddfc0477-f455-4eda-894f-23360ba370a6.mp3' -o audio/S10.mp3
          curl -fL 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/cd261f69-476e-4ef4-9973-a205d3d176fb.mp3' -o audio/S11.mp3
          curl -fL 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/429bafeb-5524-469f-a0be-7b3ffedac852.mp3' -o audio/S12.mp3
          curl -fL 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/9e6816c9-2949-4a7a-8427-d016564647d6.mp3' -o audio/S13.mp3
          ls -lh audio
      - uses: actions/upload-artifact@v4
        with:
          name: pmx-v7-audio-pack
          path: audio/*.mp3
          retention-days: 1
