name: Quiniela Live Score Monitor
on:
  schedule:
    - cron: '*/15 0-7 * * 5'
    - cron: '*/15 15-23 * * 6'
    - cron: '*/15 0-7 * * 0'
    - cron: '*/15 12-23 * * 0'
    - cron: '*/15 0-8 * * 1'
    - cron: '*/15 0-8 * * 2'
  push:
    branches: [main]
    paths:
      - 'scripts/sync-quiniela-live.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quiniela-smart-results
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Poll only games that are currently live/recent
        run: python3 scripts/sync-quiniela-live.py
      - name: Persist verified scoring changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quiniela-control/data.json quiniela-control/weeks/
          if git diff --cached --quiet; then
            echo "No new score material"
            exit 0
          fi
          git commit -m "Quiniela: sync observed live and final NFL scores"
          git push origin HEAD:main
