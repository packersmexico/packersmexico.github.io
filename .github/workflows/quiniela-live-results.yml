name: Quiniela Live Score Monitor
on:
  schedule:
    # W12 holiday kickoff coverage (UTC). The existing poller still selects the
    # due games from the verified active week's schedule.
    - cron: '6-59/15 0-5 26 11 *'   # Wed night CDMX: GB at LAR (01:00 UTC)
    - cron: '6-59/15 17-23 26 11 *' # Thanksgiving early games; Fri 00-07 slots cover the night game
    - cron: '6-59/15 19-23 27 11 *' # Black Friday: DEN at PIT (20:00 UTC)
    - cron: '6-59/15 0-1 28 11 *'   # Black Friday overtime/final spillover
    - cron: '6-59/15 0-7 * * 5'
    - cron: '6-59/15 15-23 * * 6'
    - cron: '6-59/15 0-7 * * 0'
    - cron: '6-59/15 12-23 * * 0'
    - cron: '6-59/15 0-8 * * 1'
    - cron: '6-59/15 0-8 * * 2'
    - cron: '11-59/30 9-18 * * 2' # Tuesday UTC post-MNF final/scoring retry; safely no-op after FINAL
  push:
    branches: [main]
    paths:
      - 'scripts/sync-quiniela-live.py'
      - '.github/workflows/quiniela-live-results.yml'
      # A confirmed 14/14 snapshot must trigger authenticated scoring immediately.
      - 'quiniela-control/weeks/week-*.json'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: quiniela-smart-results
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate time gates and PUSH semantics
        run: python3 scripts/sync-quiniela-live.py --self-test
      - name: Poll current score week or next CLOSED capture week
        env:
          PMX_PUSH_SECRET: ${{ secrets.PMX_PUSH_SECRET }}
        run: python3 scripts/sync-quiniela-live.py
      - name: Watch the final MNF official flag briefly without a second scheduler
        env:
          PMX_PUSH_SECRET: ${{ secrets.PMX_PUSH_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub schedule triggers may drift by hours. Only if exactly one
          # game remains, and that game's verified kickoff is well underway,
          # poll for its official ESPN completed flag within this same runner.
          # Bounded 18 checks x 90s, with no artificial FINAL or new cron.
          if ! python3 - <<'PY'
          import datetime,json
          from pathlib import Path
          root=Path('quiniela-control')
          cfg=json.load(open(root/'capture-config.json'))
          week=int(cfg.get('week_number') or 0)
          path=root/'weeks'/f'week-{week:02d}.json'
          if not path.exists():raise SystemExit(2)
          snap=json.load(open(path))
          games=snap.get('games') or []
          remaining=[g for g in games if g.get('status') not in ('FINAL','TIE')]
          if not games or len(remaining)!=1:raise SystemExit(2)
          game=remaining[0]
          try:
              stamp=datetime.datetime.fromisoformat(game['kickoff_iso'].replace('Z','+00:00'))
              now=datetime.datetime.now(datetime.timezone.utc)
              elapsed=(now-stamp).total_seconds()/60
          except (KeyError,ValueError,TypeError):raise SystemExit(2)
          ready=(cfg.get('status')=='CLOSED' and cfg.get('complete')==9 and
              snap.get('capture',{}).get('window')=='CLOSED' and
              game.get('status')=='IN_PROGRESS' and
              game.get('kickoff_iso')==max(str(g.get('kickoff_iso') or '') for g in games) and
              120<=elapsed<=300)
          print('PMX_MNF_TAIL_WATCH_GATE',json.dumps({
              'week':week,'last_game':game.get('id'),'active':ready,
              'elapsed_minutes':round(elapsed),'remaining_games':len(remaining)}))
          raise SystemExit(0 if ready else 2)
          PY
          then
            echo 'PMX_MNF_TAIL_WATCH_NOT_ELIGIBLE'
            exit 0
          fi
          for attempt in {1..18}; do
            echo "PMX_MNF_FINAL_WATCH_CHECK $attempt/18"
            python3 scripts/sync-quiniela-live.py
            if python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('quiniela-control')
          cfg=json.load(open(root/'capture-config.json'))
          snap=json.load(open(root/'weeks'/f"week-{cfg['week_number']:02d}.json"))
          games=snap.get('games') or []
          complete=bool(games) and all(
              (g.get('status')=='FINAL' and g.get('winner') in str(g.get('matchup','')).split(' @ ')) or
              (g.get('status')=='TIE' and not g.get('winner')) for g in games)
          if complete:print('PMX_MNF_FINAL_FLAG_CONFIRMED',cfg['week_number'],len(games))
          raise SystemExit(0 if complete else 1)
          PY
            then
              break
            fi
            if [ "$attempt" -lt 18 ]; then sleep 90; fi
          done
      - name: Persist verified scoring changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quiniela-control/data.json quiniela-control/weeks/
          if git diff --cached --quiet; then
            echo "No new score material"
            exit 0
          fi
          git commit -m "Quiniela: sync observed live and final NFL scores"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "PMX_OFFICIAL_SCORE_PERSISTED"
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo "::error::Could not persist official scoreboard"
              exit 1
            fi
            sleep 4
          done
      - name: Retry private scoring in this same run after verified FINAL persists
        env:
          PMX_PUSH_SECRET: ${{ secrets.PMX_PUSH_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub Actions commits made by GITHUB_TOKEN do NOT dispatch other
          # workflows via push. Refresh main and complete the required second
          # score pass here instead of waiting for unreliable cron.
          git fetch origin main
          git reset --hard origin/main
          if ! python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('quiniela-control')
          cfg=json.load(open(root/'capture-config.json'))
          data=json.load(open(root/'data.json'))
          w=int(cfg.get('week_number',0))
          p=root/'weeks'/f'week-{w:02d}.json'
          if not p.exists():
              print('PMX_TWO_PASS_SKIP_NO_SNAPSHOT')
              raise SystemExit(2)
          snap=json.load(open(p))
          games=snap.get('games') or []
          decided=bool(games) and all(
              (g.get('status')=='FINAL' and g.get('winner') in str(g.get('matchup','')).split(' @ ')) or
              (g.get('status')=='TIE' and not g.get('winner')) for g in games)
          eligible=(cfg.get('status')=='CLOSED' and cfg.get('complete')==9 and
              snap.get('capture',{}).get('window')=='CLOSED' and decided and
              snap.get('scoring',{}).get('status')!='COMPLETE' and
              int(data.get('week_number') or 0) in (w,w-1))
          print('PMX_MNF_SECOND_PASS_GATE',json.dumps({
              'week':w,'official_final':decided,'scoring_pending':eligible,
              'games':len(games),'already_scored':snap.get('scoring',{}).get('status')=='COMPLETE'
          }))
          raise SystemExit(0 if eligible else 2)
          PY
          then
            echo 'PMX_TWO_PASS_NOT_NEEDED'
            exit 0
          fi
          # The newly persisted GitHub snapshot may take a few seconds to
          # propagate to the authenticated backend; bounded retries only.
          for attempt in 1 2 3 4; do
            python3 scripts/sync-quiniela-live.py
            if python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('quiniela-control')
          cfg=json.load(open(root/'capture-config.json'))
          week=int(cfg.get('week_number') or 0)
          snap=json.load(open(root/'weeks'/f'week-{week:02d}.json'))
          data=json.load(open(root/'data.json'))
          scoring=data.get('scoring') or {}
          snap_scoring=snap.get('scoring') or {}
          results=data.get('results') or {}
          snap_results=snap.get('results') or {}
          certified=(
              cfg.get('status')=='CLOSED' and cfg.get('complete')==9 and
              data.get('week_number')==snap.get('week_number')==week and
              snap.get('capture',{}).get('window')=='CLOSED' and
              scoring.get('status')==snap_scoring.get('status')=='COMPLETE' and
              bool(scoring.get('checksum')) and scoring['checksum']==snap_scoring.get('checksum') and
              results.get('status')==snap_results.get('status')=='FINAL' and
              0 < len(snap.get('games') or [])==results.get('final')==results.get('total')==
                  snap_results.get('final')==snap_results.get('total') and
              len(data.get('season_standings') or [])==9
          )
          if not certified:
              print('PMX_POST_MNF_PRIVATE_SCORING_PENDING',week,'score_pointer',data.get('week_number'))
              raise SystemExit(1)
          print('PMX_POST_MNF_PRIVATE_SCORING_PASS',week,scoring['checksum'][:12])
          PY
            then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo '::error::Official FINAL persisted but private scoring is HOLD; no false rankings or next-week release'
              exit 1
            fi
            sleep 12
          done
          git add -- quiniela-control/data.json quiniela-control/weeks/
          if git diff --cached --quiet; then
            echo 'PMX_POST_MNF_SCORE_ALREADY_PERSISTED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Quiniela: complete private scoring immediately after official MNF final'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'PMX_POST_MNF_SCORING_PERSISTED_TO_MAIN'
              exit 0
            fi
            sleep 4
          done
          echo '::error::Private scoring passed but could not persist to main'
          exit 1
      - name: Auto-render Figma RESULTS, WEEKLY and SEASON after complete verified MNF
        env:
          PMX_PUSH_SECRET: ${{ secrets.PMX_PUSH_SECRET }}
        run: bash scripts/run-quiniela-auto-render.sh final
      - name: Trigger existing season capture workflow immediately after certified MNF
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('quiniela-control')
          data=json.load(open(root/'data.json'))
          cfg=json.load(open(root/'capture-config.json'))
          week=int(data.get('week_number') or 0)
          scoring=data.get('scoring') or {}
          results=data.get('results') or {}
          verified=(
            9<=week<=17 and cfg.get('week_number')==week and
            cfg.get('status')=='CLOSED' and
            scoring.get('status')=='COMPLETE' and bool(scoring.get('checksum')) and
            results.get('status')=='FINAL' and
            results.get('final')==results.get('total') and
            len(data.get('season_standings') or [])==9
          )
          print('PMX_POST_MNF_AUTO_OPEN_GATE',json.dumps({'week':week,'certified':verified,'next_week':week+1 if verified else None}))
          pathlib.Path('/tmp/pmx-trigger-next-week').write_text('1' if verified else '0')
          PY
          if [ "$(cat /tmp/pmx-trigger-next-week)" != '1' ]; then
            echo "PMX_NEXT_WEEK_DISPATCH_HOLD_UNCERTIFIED"
            exit 0
          fi
          # workflow_dispatch is allowed from GITHUB_TOKEN. Do NOT create a
          # second orchestrator or rely on an unreliable schedule-only handoff.
          gh workflow run quiniela-capture-reconcile.yml --ref main
          echo "PMX_NEXT_WEEK_DISPATCHED_TO_EXISTING_WORKFLOW"
