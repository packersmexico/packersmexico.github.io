name: Sync Figma Quiniela Assets

on:
  push:
    branches:
      - main
    paths:
      - 'quiniela-control/figma-export-manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download current Figma exports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess
          manifest = json.load(open('quiniela-control/figma-export-manifest.json', encoding='utf-8'))
          for asset in manifest['assets']:
              url = asset['url']
              target = pathlib.Path(asset['target'])
              if not str(target).startswith('quiniela-control/exports/') or target.suffix.lower() != '.png':
                  raise SystemExit(f'Invalid target: {target}')
              target.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(['curl','--fail','--location','--silent','--show-error',url,'--output',str(target)], check=True)
              if target.stat().st_size < 10000:
                  raise SystemExit(f'Asset too small: {target}')
          PY

      - name: Commit refreshed publication assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json
          manifest = json.load(open('quiniela-control/figma-export-manifest.json', encoding='utf-8'))
          for asset in manifest['assets']:
              print(asset['target'])
          PY
          mapfile -t TARGETS < <(python - <<'PY'
          import json
          manifest = json.load(open('quiniela-control/figma-export-manifest.json', encoding='utf-8'))
          for asset in manifest['assets']:
              print(asset['target'])
          PY
          )
          git add -- "${TARGETS[@]}"
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "Quiniela: refresh Figma publication PNGs"
          git push origin HEAD:main
