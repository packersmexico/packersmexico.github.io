name: Quiniela Control QA
on:
  pull_request:
    paths:
      - 'quiniela-control/**'
      - 'scripts/quiniela_scoring.py'
      - 'scripts/sync-quiniela-live.py'
      - 'scripts/test_quiniela_scoring.py'
      - 'scripts/stage-quiniela-editorial.mjs'
      - '.github/workflows/quiniela-progressive-editorial.yml'
      - 'push-backend/**'
      - '.github/workflows/quiniela-push-notifications.yml'
      - '.github/workflows/quiniela-milestone-push.yml'
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check quiniela-control/app.js
          node --check quiniela-control/panel-week-assets.js
          node --check quiniela-control/exports/live.js
          node --check quiniela-control/push.js
          node --check quiniela-control/push-sw.js
          node --check push-backend/api/config.js
          node --check push-backend/api/subscribe.js
          node --check push-backend/api/notify.js
          node --check push-backend/api/jotform-submission.js
          node --check push-backend/api/capture-status.js
          node --check push-backend/lib/jotform-capture.js
          node --check push-backend/lib/weekly-capture.js
          node --check push-backend/lib/weekly-rankings.js
          node --check push-backend/api/scoring-status.js
          node --check push-backend/scripts/score-week06.mjs
          node --check push-backend/scripts/discover-week07.mjs
          node --check push-backend/scripts/setup-week07.mjs
          node --check push-backend/scripts/catchup-week07.mjs
          node --check push-backend/scripts/notify-rodrigo-w6-w7.mjs
          node --check push-backend/lib/jotform-hydration.js
          node --check push-backend/api/reconcile-week-06.js
          node --check push-backend/scripts/reconcile-on-deploy.mjs
          node --check push-backend/lib/jotform-baseline.js
          node --check push-backend/api/milestone-sync.js
          node --check push-backend/lib/milestone-events.js
          node --check push-backend/api/health.js
          node --check push-backend/lib/http.js
          node --check push-backend/lib/redis.js
      - name: JSON validity
        run: |
          node -e "JSON.parse(require('fs').readFileSync('quiniela-control/data.json','utf8'));JSON.parse(require('fs').readFileSync('quiniela-control/capture-config.json','utf8'));JSON.parse(require('fs').readFileSync('quiniela-control/weeks/week-06.json','utf8'));JSON.parse(require('fs').readFileSync('quiniela-control/weeks/week-03.json','utf8'));JSON.parse(require('fs').readFileSync('quiniela-control/push-config.json','utf8'));JSON.parse(require('fs').readFileSync('quiniela-control/notifications.json','utf8'));JSON.parse(require('fs').readFileSync('push-backend/package.json','utf8'));JSON.parse(require('fs').readFileSync('push-backend/vercel.json','utf8'));"
      - name: Quiniela PUSH scoring, W5 regression and locked-picks integrity
        run: |
          python3 -m py_compile scripts/quiniela_scoring.py scripts/sync-quiniela-live.py
          python3 -m unittest discover -s scripts -p 'test_quiniela_scoring.py' -v
      - name: Operator alerts V2 · W6 opening, 9/9, MNF, files, publication
        run: node --test push-backend/tests/milestone-events.test.mjs
      - name: Jotform W6 first-valid 14/14 validation
        run: node --test push-backend/tests/jotform-capture.test.mjs
      - name: Reusable week capture / GB lock / BYE / universal PUSH
        run: node --test push-backend/tests/weekly-capture.test.mjs
      - name: Asset index writer preserves certified W6 and historic W5
        run: |
          node scripts/refresh-quiniela-assets.mjs
          git diff --exit-code -- quiniela-control/exports/asset-index.json
      - name: W6 closure and safe preview assertions
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const form=read('quiniela-control/capture-config.json');
          const wk=read('quiniela-control/weeks/week-06.json');
          const assets=read('quiniela-control/exports/asset-index.json');
          assert.equal(form.status,'CLOSED');
          assert.equal(form.week_number,7);
          assert.equal(form.form_status,'DISABLED');
          assert.equal(wk.capture.window,'CLOSED');
          assert.equal(assets.weeks['6'].capture.window,'CLOSED');
          assert.equal(assets.weeks['7'].capture.window,'CLOSED');
          assert.equal(form.complete,9);
          assert.equal(form.received_picks,126);
          assert.equal(assets.weeks['7'].assets.picks.state,'READY');
          assert.equal(assets.weeks['7'].assets.picks.href,'./w7-picks-board.png');
          const w7png=fs.readFileSync('quiniela-control/exports/w7-picks-board.png');
          assert.deepEqual([...w7png.subarray(0,8)],[137,80,78,71,13,10,26,10]);
          assert.equal(w7png.readUInt32BE(16),1600);
          assert.equal(w7png.readUInt32BE(20),2000);
          assert.equal(assets.weeks['6'].capture.complete,9);
          assert.equal(assets.weeks['6'].results.final,14);
          const pngs={picks:['w6-picks-board.png',1600,2000],results:['w6-results-final.png',1600,2000],weekly:['w6-ranking-weekly.png',1080,1350],season:['w6-ranking-season.png',1080,1350]};
          for(const [slot,[name,width,height]] of Object.entries(pngs)){
            const asset=assets.weeks['6'].assets[slot];
            assert.equal(asset.state,'READY');
            assert.equal(asset.href,'./'+name);
            const bytes=fs.readFileSync('quiniela-control/exports/'+name);
            assert.deepEqual([...bytes.subarray(0,8)],[137,80,78,71,13,10,26,10]);
            assert.equal(bytes.readUInt32BE(16),width);
            assert.equal(bytes.readUInt32BE(20),height);
          }
          assert.equal(assets.weeks['5'].assets.results.state,'RIGHTS_HOLD');
          NODE
      - name: Private CAS hydration original picks validation
        run: node --test push-backend/tests/jotform-hydration.test.mjs
      - name: Progressive W5 results and privacy-masked W6 picks preview · QA
        run: |
          node --check scripts/stage-quiniela-editorial.mjs
          node scripts/stage-quiniela-editorial.mjs --self-test
          node scripts/stage-quiniela-editorial.mjs
      - name: Library QA · capture W6 ahead while W5 score incomplete
        run: |
          node --check scripts/refresh-quiniela-assets.mjs
          node --check quiniela-control/exports/assets-library.js
          node scripts/refresh-quiniela-assets.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const d=read('quiniela-control/data.json');
          const c=read('quiniela-control/capture-config.json');
          const ix=read('quiniela-control/exports/asset-index.json');
          assert.equal(ix.score_week,d.week_number);
          assert.equal(ix.capture_week,c.week_number);
          assert.equal(ix.active_week,Math.max(d.week_number,c.week_number));
          assert(ix.weeks[c.week_number]);
          assert(ix.weeks[d.week_number]);
          if(c.week_number>d.week_number&&d.results.final<d.results.total)
            assert.equal(ix.in_progress_week,d.week_number);
          const future=ix.weeks[c.week_number];
          if(c.week_number>d.week_number&&c.complete!==c.total)
            assert.notEqual(future.assets.picks.state,'READY');
          console.log('PASS: Week6 upcoming capture + W5 results + asset QA gates');
          NODE
      - name: Required files
        run: |
          test -f quiniela-control/index.html
          test -f quiniela-control/exports/live.html
          test -f quiniela-control/push.js
          test -f quiniela-control/push-sw.js
          test -f push-backend/api/notify.js
          test -f push-backend/README.md
          test -f assets/PMX_LOGO_HISTORICO_HORIZONTAL_CANVA_MASTER_V1.1.svg
